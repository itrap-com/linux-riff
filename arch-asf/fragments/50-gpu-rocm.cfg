# Radeon RX 7900 XT (RDNA 3, navi31) + Raphael iGPU (gfx1036) + ROCm/HSA compute
# DRM_AMDGPU as module with KFD compute path and SVM/P2P for ROCm workloads.

# Core DRM + display helpers
CONFIG_DRM=m
CONFIG_DRM_KMS_HELPER=m
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_DISPLAY_HELPER=m
CONFIG_DRM_DP_AUX_CHARDEV=y

# AMDGPU
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMDGPU_SI=y
CONFIG_DRM_AMDGPU_CIK=y
CONFIG_DRM_AMDGPU_USERPTR=y
CONFIG_DRM_AMD_DC=y
CONFIG_DRM_AMD_DC_FP=y
CONFIG_DRM_AMD_DC_HDCP=y
CONFIG_DRM_AMD_SECURE_DISPLAY=y
CONFIG_HSA_AMD=y
CONFIG_HSA_AMD_SVM=y
CONFIG_HSA_AMD_P2P=y

# ACP audio (HDMI / DP audio path)
CONFIG_DRM_AMD_ACP=y

# Framebuffer console for early boot
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y

# Backlight / lcd helpers (modules, harmless on desktop)
CONFIG_BACKLIGHT_CLASS_DEVICE=y
