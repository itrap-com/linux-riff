# 91-trim-exotic.cfg — drop exotic subsystems this specific box will never use.
# Complements 90-disable-unused.cfg (which drops other-vendor GPUs/NICs, ISA,
# parport, touchscreens). Everything here is currently =m, so trimming costs
# nothing at runtime/boot — the win is a smaller modules tree, a faster
# `make modules`, and a little less attack surface.
#
# DELIBERATELY KEPT (do not add here without confirming the hardware is absent):
#   CONFIG_MEDIA_SUPPORT / CONFIG_DVB_CORE — back USB webcams / V4L / capture,
#   commonly wanted on a desktop. Drop only if you're certain no webcam ever.
#
# Hardware on this box: 7950X3D, RX 7900 XT, Raphael iGPU, MT7925 Wi-Fi/BT,
# Intel I225/I226 NIC, NVMe. None of the below applies.

# Amateur radio stack
# CONFIG_HAMRADIO is not set

# CAN bus (automotive/industrial)
# CONFIG_CAN is not set

# AppleTalk networking (legacy)
# CONFIG_ATALK is not set

# InfiniBand / RDMA (datacenter fabric)
# CONFIG_INFINIBAND is not set

# Fibre Channel SCSI transport
# CONFIG_SCSI_FC_ATTRS is not set

# Legacy / foreign filesystems we never mount
# CONFIG_JFS_FS is not set
# CONFIG_MINIX_FS is not set
# CONFIG_HFS_FS is not set
# CONFIG_HFSPLUS_FS is not set

# NFC (no NFC reader on this desktop)
# CONFIG_NFC is not set

# GPIO-attached rfkill (laptop hardware; normal RFKILL stays on for the MT7925)
# CONFIG_RFKILL_GPIO is not set

# Memory Technology Devices (raw flash / embedded) — NVMe is block, not MTD
# CONFIG_MTD is not set

# PCMCIA / CardBus (laptop expansion, absent)
# CONFIG_PCMCIA is not set

# Sony Memory Stick
# CONFIG_MEMSTICK is not set

# FireWire / IEEE-1394 (no FireWire ports)
# CONFIG_FIREWIRE is not set
