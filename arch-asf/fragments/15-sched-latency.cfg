# 15-sched-latency.cfg — scheduler + RCU + tick tuning for low-latency desktop.
# Note: zen 6.17 ships stock EEVDF (no BORE patch in this tree); EEVDF already
# delivers strong interactive behavior. Earlier draft had CONFIG_SCHED_BORE=y,
# removed (symbol not present).

# PREEMPT model: dynamic switchable at boot via preempt= cmdline
CONFIG_PREEMPT_BUILD=y
CONFIG_PREEMPT=y
CONFIG_PREEMPT_DYNAMIC=y
CONFIG_PREEMPTION=y
CONFIG_PREEMPT_COUNT=y
CONFIG_PREEMPT_RCU=y

# RCU offload — keep RCU work off latency-critical CPUs
CONFIG_RCU_NOCB_CPU=y
CONFIG_RCU_NOCB_CPU_DEFAULT_ALL=y
CONFIG_RCU_BOOST=y
CONFIG_RCU_BOOST_DELAY=0

# Scheduler topology — CRITICAL for 7950X3D dual-CCD (X3D vs non-X3D asymmetry)
CONFIG_SCHED_AUTOGROUP=y
CONFIG_SCHED_CORE=y
CONFIG_SCHED_HRTICK=y
CONFIG_SCHED_CLUSTER=y
CONFIG_SCHED_SMT=y
CONFIG_SCHED_MC=y
CONFIG_SCHED_MC_PRIO=y
CONFIG_SCHED_OMIT_FRAME_POINTER=y
CONFIG_SCHED_MM_CID=y

# Timer
CONFIG_HZ_1000=y
CONFIG_HZ=1000
CONFIG_HIGH_RES_TIMERS=y
CONFIG_NO_HZ_COMMON=y
CONFIG_NO_HZ_IDLE=y
CONFIG_NO_HZ=y
CONFIG_TICK_ONESHOT=y
CONFIG_TICK_CPU_ACCOUNTING=y

# Disable scheduler stats counters for tiny hot-path win
CONFIG_SCHEDSTATS=n
