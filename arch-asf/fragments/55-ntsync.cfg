# Wine/Proton ntsync + gamepad/joystick + 32-bit ABI for Steam runtime
# NTSYNC is the new in-kernel wineserver primitive (upstreamed in 6.10+).

# ntsync (Wine/Proton fast sync primitive)
CONFIG_NTSYNC=m

# 32-bit user-space ABI (Steam, older games)
CONFIG_IA32_EMULATION=y
CONFIG_X86_X32_ABI=y
CONFIG_COMPAT=y
CONFIG_COMPAT_32BIT_TIME=y

# Joystick / gamepad subsystem
CONFIG_INPUT_JOYSTICK=y
CONFIG_JOYSTICK_XPAD=m
CONFIG_JOYSTICK_XPAD_FF=y
CONFIG_JOYSTICK_XPAD_LEDS=y

# HID gaming devices
CONFIG_HID_LOGITECH=m
CONFIG_HID_LOGITECH_DJ=m
CONFIG_HID_LOGITECH_HIDPP=m
CONFIG_HID_MICROSOFT=m
CONFIG_HID_SONY=m
CONFIG_SONY_FF=y
CONFIG_HID_NINTENDO=m
CONFIG_NINTENDO_FF=y
CONFIG_HID_PLAYSTATION=m
CONFIG_PLAYSTATION_FF=y
CONFIG_HID_STEAM=m
CONFIG_HID_XBOX_360=m

# Userspace input event device + uinput
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_UINPUT=m
