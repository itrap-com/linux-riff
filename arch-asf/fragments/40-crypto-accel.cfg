# 40-crypto-accel.cfg — hardware crypto paths
# Note: in kernel 6.17 most SIMD crypto (SHA1/256/512, BLAKE2S, ChaCha20,
# Poly1305, CRC32) moved to lib/crypto/x86/ and is auto-built when the
# assembler/CPU supports the instructions. The earlier draft listed many
# CRYPTO_*_AVX2 / _X86_64 symbols that no longer exist; this fragment lists
# only the modules that remain user-selectable in arch/x86/crypto/Kconfig
# and crypto/Kconfig.

CONFIG_CRYPTO=y
CONFIG_CRYPTO_HW=y

# AES-NI: single module that automatically uses VAES + AVX-512 paths when present
CONFIG_CRYPTO_AES_NI_INTEL=y

# Carryless-multiply paths (GHASH for GCM, POLYVAL for AES-GCM-SIV)
CONFIG_CRYPTO_GHASH_CLMUL_NI_INTEL=y
CONFIG_CRYPTO_POLYVAL_CLMUL_NI=y

# AEAD + NH MAC for fscrypt
CONFIG_CRYPTO_AEGIS128_AESNI_SSE2=m
CONFIG_CRYPTO_NHPOLY1305_AVX2=m

# User-space crypto API (for libkcapi etc.)
CONFIG_CRYPTO_USER=m
CONFIG_CRYPTO_USER_API=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_CRYPTO_USER_API_RNG=y
CONFIG_CRYPTO_USER_API_AEAD=y
