# Full virtualization + AMD-Vi IOMMU + VFIO (gaming VM / passthrough ready)
# Zen 4 + RX 7900 XT: enable vfio-pci so the dGPU can be passed to a guest if desired.

# KVM / virtio host
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=m
CONFIG_KVM_AMD=m
CONFIG_KVM_AMD_SEV=y
CONFIG_VHOST=m
CONFIG_VHOST_NET=m
CONFIG_VHOST_VSOCK=m
CONFIG_VHOST_SCSI=m

# virtio guest drivers (also useful for nested / cloud images)
CONFIG_VIRTIO_PCI=m
CONFIG_VIRTIO_BLK=m
CONFIG_VIRTIO_NET=m
CONFIG_VIRTIO_CONSOLE=m
CONFIG_VIRTIO_BALLOON=m
CONFIG_VIRTIO_INPUT=m
CONFIG_VIRTIO_MMIO=m
CONFIG_DRM_VIRTIO_GPU=m
CONFIG_SCSI_VIRTIO=m
CONFIG_HW_RANDOM_VIRTIO=m
CONFIG_CRYPTO_DEV_VIRTIO=m

# AMD IOMMU (AMD-Vi) + DMA remap
CONFIG_IOMMU_SUPPORT=y
CONFIG_AMD_IOMMU=y
CONFIG_IOMMU_DEFAULT_DMA_LAZY=y
CONFIG_IOMMU_DMA=y
CONFIG_IRQ_REMAP=y

# VFIO for GPU passthrough
CONFIG_VFIO=m
CONFIG_VFIO_PCI=m
CONFIG_VFIO_PCI_MMAP=y
CONFIG_VFIO_PCI_INTX=y
CONFIG_VFIO_IOMMU_TYPE1=m
CONFIG_VFIO_VIRQFD=y

# UIO (occasionally needed for userspace drivers)
CONFIG_UIO=m
CONFIG_UIO_PCI_GENERIC=m
