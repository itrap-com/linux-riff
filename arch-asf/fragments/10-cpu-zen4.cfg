# 10-cpu-zen4.cfg — Zen 4 / 7950X3D CPU-specific tuning
# X86_NATIVE_CPU=y is already set in the base config (clang's -march=native picks
# znver4 automatically). This fragment adds AMD platform drivers + amd-pstate-epp.

# Reaffirm CPU target (already on)
CONFIG_X86_NATIVE_CPU=y

# P-state: amd-pstate-epp (active EPP) — correct governor for Zen 3+ with CPPC
CONFIG_X86_AMD_PSTATE=y
CONFIG_X86_AMD_PSTATE_DEFAULT_MODE=3
CONFIG_X86_AMD_PSTATE_UT=n

# AMD platform drivers
CONFIG_AMD_HSMP=m
CONFIG_AMD_PMC=m
CONFIG_AMD_PMF=m
CONFIG_X86_AMD_PLATFORM_DEVICE=y
CONFIG_AMD_NB=y

# Perf event sources (for `perf`)
CONFIG_PERF_EVENTS=y
CONFIG_PERF_EVENTS_AMD_BRS=y
CONFIG_PERF_EVENTS_AMD_UNCORE=m
CONFIG_PERF_EVENTS_AMD_POWER=m

# AMD Cryptographic Coprocessor + PSP + PassThrough DMA (also a TRNG source)
CONFIG_CRYPTO_DEV_CCP=y
CONFIG_CRYPTO_DEV_CCP_DD=y
CONFIG_CRYPTO_DEV_SP_PSP=y
CONFIG_AMD_PTDMA=m

# We are not Intel
CONFIG_X86_INTEL_PSTATE=n
