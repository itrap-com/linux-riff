# 80-lto-clang.cfg — Clang ThinLTO + KCFI. REQUIRES `make LLVM=1`.

# Toolchain detection symbols (CC_IS_CLANG, LD_IS_LLD) are def_bool y when
# build.sh runs with LLVM=1 — do NOT set them directly.

# HAS_LTO_CLANG depends on !GCOV_KERNEL — the zen-kernel seed ships
# GCOV_KERNEL=y, which silently disables LTO_CLANG_THIN. Drop it.
# CONFIG_GCOV_KERNEL is not set

# LTO — flip the `choice "LTO"` block: explicitly disable LTO_NONE
# (the seed has it =y) and enable LTO_CLANG_THIN. CONFIG_LTO and
# CONFIG_LTO_CLANG are auto-selected by LTO_CLANG_THIN.
# CONFIG_LTO_NONE is not set
CONFIG_LTO_CLANG_THIN=y

# Kernel CFI — Clang Control Flow Integrity
CONFIG_CFI_CLANG=y
CONFIG_CFI_PERMISSIVE=n

# Dead-code elimination at link time
CONFIG_LD_DEAD_CODE_DATA_ELIMINATION=y

# Disable kernel concurrency sanitizer (dev-only)
CONFIG_KCSAN=n

# kallsyms tweak that works with LTO
CONFIG_KALLSYMS_ABSOLUTE_PERCPU=y
