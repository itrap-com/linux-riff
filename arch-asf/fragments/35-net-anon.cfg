# 35-net-anon.cfg — WireGuard, nftables, namespaces, TPROXY, MT7925 Wi-Fi 7

# WireGuard built-in (works in early-userspace and initramfs scenarios)
CONFIG_WIREGUARD=y

# nftables (modern netfilter)
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_NETDEV=y
CONFIG_NFT_NUMGEN=m
CONFIG_NFT_CT=m
CONFIG_NFT_FLOW_OFFLOAD=m
CONFIG_NFT_COUNTER=m
CONFIG_NFT_CONNLIMIT=m
CONFIG_NFT_LOG=m
CONFIG_NFT_LIMIT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_REDIR=m
CONFIG_NFT_NAT=m
CONFIG_NFT_TUNNEL=m
CONFIG_NFT_OBJREF=m
CONFIG_NFT_QUEUE=m
CONFIG_NFT_QUOTA=m
CONFIG_NFT_REJECT=m
CONFIG_NFT_COMPAT=m
CONFIG_NFT_HASH=m
CONFIG_NFT_FIB_INET=m
CONFIG_NFT_SOCKET=m
CONFIG_NFT_OSF=m
CONFIG_NFT_TPROXY=m
CONFIG_NFT_SYNPROXY=m

# Transparent proxy primitives (for Tor / privacy routers via xt or nft)
CONFIG_NF_TPROXY_IPV4=m
CONFIG_NF_TPROXY_IPV6=m
CONFIG_NETFILTER_XT_TARGET_TPROXY=m

# IPv6 stack
CONFIG_IPV6=y

# Namespaces — required by Bubblewrap / Firejail / podman-rootless
CONFIG_NAMESPACES=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y

# IPsec (already in base)
CONFIG_XFRM=y
CONFIG_XFRM_USER=y

# Netlink interfaces (diag)
CONFIG_NETFILTER_NETLINK_QUEUE=m
CONFIG_NETFILTER_NETLINK_LOG=y
CONFIG_NETLINK_DIAG=m
CONFIG_PACKET_DIAG=m

# Wi-Fi (MT7925 — your card)
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_RFKILL=m
CONFIG_MT76_CORE=m
CONFIG_MT76_CONNAC_LIB=m
CONFIG_MT7925_COMMON=m
CONFIG_MT7925E=m
