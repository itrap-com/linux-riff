# 70-privacy.cfg — information minimization / leak prevention
# Note: RANDOM_TRUST_CPU/BOOTLOADER and DEVKMEM are no longer Kconfig in this
# kernel. Distrust of RDRAND is enforced via cmdline (random.trust_cpu=0,
# random.trust_bootloader=0) in the systemd-boot entries. DEVKMEM was removed
# upstream.

# Kill /proc/kcore (live-RAM exfil via file read)
CONFIG_PROC_KCORE=n
CONFIG_PROC_PAGE_MONITOR=n

# Restrict /dev/mem and /dev/kmem
CONFIG_STRICT_DEVMEM=y
CONFIG_IO_STRICT_DEVMEM=y

# Disable kexec — common chain-of-trust bypass vector
CONFIG_KEXEC=n
CONFIG_KEXEC_FILE=n

# Keep hibernation (useful)
CONFIG_HIBERNATION=y

# Keep user namespaces (needed for podman-rootless, Bubblewrap, Firejail)
CONFIG_USER_NS_UNPRIVILEGED=y

# Reaffirm dmesg restriction
CONFIG_SECURITY_DMESG_RESTRICT=y
