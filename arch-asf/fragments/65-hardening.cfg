# 65-hardening.cfg — compile-time & runtime memory hardening

# Stack
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_VMAP_STACK=y
CONFIG_SCHED_STACK_END_CHECK=y
CONFIG_THREAD_INFO_IN_TASK=y

# Compile-time bounds checks
CONFIG_FORTIFY_SOURCE=y

# User-copy bounds
CONFIG_HARDENED_USERCOPY=y

# Zero on alloc (cheap, kills uninitialized info leaks)
CONFIG_INIT_STACK_ALL_ZERO=y
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
CONFIG_INIT_ON_FREE_DEFAULT_ON=n

# Heap hardening
CONFIG_RANDOM_KMALLOC_CACHES=y
CONFIG_SLAB_FREELIST_HARDENED=y

# Register zeroing on function return — clears caller-saved registers at every
# function exit so stale values can't be harvested by ROP / data-oriented
# attacks. Clang supports it here (CC_HAS_ZERO_CALL_USED_REGS=y); cost is a few
# percent on call-heavy paths, negligible for desktop / game / compute.
CONFIG_ZERO_CALL_USED_REGS=y

# Full struct-layout randomization — clang 22 in this tree supports it
# (CC_HAS_RANDSTRUCT=y), so it no longer needs the GCC plugin. Randomizes the
# field order of all-function-pointer and explicitly-marked structs at build
# time, defeating layout-dependent exploits. The seed is baked into the build,
# so in-tree modules and DKMS rebuilds against these headers stay compatible.
CONFIG_RANDSTRUCT_FULL=y

# KASLR — bump memory padding from 0x0 default
CONFIG_RANDOMIZE_BASE=y
CONFIG_RANDOMIZE_MEMORY=y
CONFIG_RANDOMIZE_MEMORY_PHYSICAL_PADDING=0xa
CONFIG_RANDOMIZE_KSTACK_OFFSET=y
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y

# Low-overhead sampling KASAN
CONFIG_KFENCE=y
CONFIG_KFENCE_SAMPLE_INTERVAL=100

# Detect data structure corruption and panic
CONFIG_BUG_ON_DATA_CORRUPTION=y
CONFIG_DEBUG_LIST=y
CONFIG_DEBUG_SG=y

# Memory protection
CONFIG_STRICT_KERNEL_RWX=y
CONFIG_STRICT_MODULE_RWX=y

# Block NULL deref exploits
CONFIG_DEFAULT_MMAP_MIN_ADDR=65536

# Drop legacy attack vectors
CONFIG_LEGACY_VSYSCALL_NONE=y
CONFIG_LEGACY_PTYS=n
CONFIG_COMPAT_VDSO=n

# We do NOT enable STATIC_USERMODEHELPER (no static helper binary on this system)
CONFIG_STATIC_USERMODEHELPER=n
