# 90-riff-dot-strict.conf — force DNS-over-TLS (no plaintext fallback).
# Sorts after 10-dns.conf / no-dnssec.conf so this DNSOverTLS value wins.
# Cloudflare (1.1.1.1/1.0.0.1) and Quad9 (9.9.9.9) all support DoT, so strict
# mode resolves normally; if a resolver ever can't do DoT, resolution fails
# instead of silently leaking plaintext DNS. DNSSEC left as configured upstream
# (no-dnssec.conf) — DoT already encrypts the query path.
#
# NOTE: the Tailscale link (100.100.100.100 MagicDNS) is internal and exempt;
# systemd-resolved does not apply DoT to that per-link resolver.

[Resolve]
DNSOverTLS=yes
