# 30-riff-mac-privacy.conf — Wi-Fi/Ethernet MAC privacy.
# Goal: per-connection STABLE random MAC (good privacy without breaking DHCP
# reservations or captive portals on networks you actually use), plus a fresh
# random MAC during background scans so you don't leak your real hwaddr while
# probing for APs.
#
# cloned-mac-address=stable -> MAC is a hash of (connection-uuid + a machine
# secret); it stays constant for a given saved network across reboots, but
# differs between networks and reveals nothing about the real hardware MAC.
# Use =random instead for a new MAC on every single activation (max anonymity,
# lower reliability). =preserve/permanent reverts to the hardware MAC.
#
# Tailscale/VPN are unaffected (virtual links ignore these device keys).

[device-mac-randomization]
wifi.scan-rand-mac-address=yes

[connection-mac-randomization]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
