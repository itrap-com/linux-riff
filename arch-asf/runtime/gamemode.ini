# /etc/gamemode.ini — system-wide GameMode tuning for this box
# (7950X3D + RX 7900 XT). Activated automatically when a game is launched with
# `gamemoderun %command%` (Steam) or any gamemode-aware title.
#
# Install: sudo install -Dm644 arch-asf/runtime/gamemode.ini /etc/gamemode.ini

[general]
# Renice the game's processes for lower scheduling latency (1..20).
renice=10
# amd-pstate is in "active" mode; only performance/powersave govs exist.
# Flip to performance while gaming, restore powersave (EPP-driven boost) after.
desiredgov=performance
defaultgov=powersave
# Raise scheduling priority to SCHED_ISO-like soft real-time when supported.
softrealtime=auto
# Highest best-effort I/O priority for the game (0 = top of best-effort class).
ioprio=0
# Keep the screen from blanking mid-session.
inhibit_screensaver=1

[cpu]
# 7950X3D: leave both CCDs available. The kernel's X3D scheduling already
# steers cache-sensitive game threads onto the V-cache CCD; hard-parking the
# frequency CCD usually hurts more than it helps for mixed workloads.
park_cores=no
pin_cores=no

[gpu]
# Opt in to GPU tweaks and target the discrete RX 7900 XT (card1; card0 is the
# Raphael iGPU). "high" pins the dGPU to its top power/clock state while gaming.
apply_gpu_optimisations=accept-responsibility
gpu_device=1
amd_performance_level=high

[custom]
start=notify-send -a GameMode "GameMode started" "performance gov + GPU high"
end=notify-send -a GameMode "GameMode ended" "restored powersave"
