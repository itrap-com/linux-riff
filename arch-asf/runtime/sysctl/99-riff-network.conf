# 99-riff-network.conf — single authoritative network+VM tuning drop-in.
# Consolidates and supersedes the redundant set that had accumulated:
#   98-socket-buffers.conf, 99-net-tune.conf, 99-net-tuning.conf,
#   99-network-tuning.conf, 99-desktop-latency.conf, 90-swappiness.conf
# (Those should be removed — they triplicated BBR/fq and duplicated swappiness.)
# NOT consolidated: 99-tailscale.conf stays as-is (ip_forward is a distinct,
# functional requirement for the tailscale exit-node and shouldn't live here).
#
# Primary link on this host is Wi-Fi 7 (mt7925, wlp9s0); wired 2.5GbE (igc/eno1)
# is currently down. These values suit a fast home link with bursty desktop +
# bulk transfer (Steam/AI dataset pulls) and keep latency low.

# ---- congestion control + queueing (BBR is best-in-class for throughput+latency) ----
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ---- socket buffer ceilings (64 MiB) — lets a single fast flow fill the pipe ----
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 131072 67108864
net.ipv4.tcp_wmem = 4096 65536  67108864

# ---- connection setup + sustained-throughput latency wins ----
net.ipv4.tcp_fastopen = 3          # client+server TFO
net.ipv4.tcp_mtu_probing = 1       # recover from PMTU black holes (matters on Wi-Fi/VPN)
net.ipv4.tcp_slow_start_after_idle = 0   # don't re-slow-start an idle bulk connection
net.ipv4.tcp_notsent_lowat = 131072      # lower bufferbloat on local TX queue

# ---- backlog sizing for high pps bursts ----
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192

# ---- VM: favor cache over swap on a 32-thread desktop with NVMe+zswap ----
vm.swappiness = 10
